<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Registration | My School System Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:720px;margin:24px auto}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 8px 24px #14213d0b}h1{margin:0 0 8px;color:#14213d}p{color:#64748b;line-height:1.5}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:12px 16px;background:#2563eb;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.muted{font-size:13px;color:#64748b}.msg{padding:12px;border-radius:8px;margin:12px 0;background:#eff6ff;color:#1d4ed8}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#fef3c7;color:#92400e;font-size:12px;font-weight:bold}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #e2e8f0;padding:12px 0}.row:last-child{border:0}a{color:#2563eb}
</style></head><body><main class="wrap"><section class="card"><h1>Register a school</h1><p>School registration is available to authenticated School Administrators. Your request stays pending until the Super Admin approves it.</p><div id="who" class="msg">Checking your account…</div><form id="requestForm" hidden><div class="field"><label for="schoolName">SCHOOL NAME</label><input id="schoolName" required minlength="2" maxlength="200" placeholder="Enter the official school name"></div><div class="field"><label for="schoolCode">SCHOOL CODE</label><input id="schoolCode" required minlength="2" maxlength="30" placeholder="Unique code, e.g. GREENHILL01"></div><div class="field"><label for="county">COUNTY / LOCATION</label><input id="county" maxlength="120" placeholder="County or location"></div><button id="submitBtn">Submit registration request</button></form><div id="requests"></div><p class="muted"><a href="./index.html">Return to My School System Manager sign in</a> · Only the Super Admin can approve or reject requests.</p></section></main>
<script>
const URL='https://emdmnimxeoifgobzuglx.supabase.co', KEY='sb_publishable_ewvNnOPh_pGROM_f_rp1Sg_bWGi5OAV', sb=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);let user=null,profile=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){$('who').textContent='Please sign in to the main My School System Manager app first, then open this page.';return}user=session.user;const {data,error}=await sb.from('profiles').select('id,role,full_name,school_id').eq('id',user.id).single();if(error||!data){$('who').textContent='Your account profile could not be loaded.';return}profile=data;if(profile.role!=='principal'&&profile.role!=='super_admin'){$('who').textContent='Access denied. Only School Administrators can request school registration.';return}if(profile.role==='super_admin'){$('who').innerHTML='You are the Super Admin. <a href="./school-approvals.html">Open school approvals</a>';return}if(profile.school_id){$('who').textContent='Your account is already linked to an approved school. Contact the Super Admin if you need another school.';return}$('who').textContent='Signed in as '+(profile.full_name||user.email)+'. Submit a request below; access is not activated until approval.';$('requestForm').hidden=false;await loadRequests()}
async function loadRequests(){const {data,error}=await sb.from('school_registration_requests').select('school_name,code,county,status,review_notes,created_at').eq('requested_by',user.id).order('created_at',{ascending:false});if(error){$('requests').innerHTML='<p class="muted">Could not load requests: '+esc(error.message)+'</p>';return}if(data?.length)$('requests').innerHTML='<h2>Your requests</h2>'+data.map(r=>'<div class="row"><div><b>'+esc(r.school_name)+'</b><div class="muted">'+esc(r.code)+' · '+esc(r.county||'Location not specified')+'</div>'+(r.review_notes?'<div class="muted">'+esc(r.review_notes)+'</div>':'')+'</div><span class="status">'+esc(r.status)+'</span></div>').join('')}
$('requestForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('submitBtn');btn.disabled=true;try{const school_name=$('schoolName').value.trim(),code=$('schoolCode').value.trim().toUpperCase(),county=$('county').value.trim()||null;const {error}=await sb.from('school_registration_requests').insert({school_name,code,county,requested_by:user.id,status:'pending'});if(error)throw error;$('who').textContent='Request submitted successfully. The Super Admin must approve it before school access is activated.';$('requestForm').reset();await loadRequests()}catch(err){$('who').textContent='Could not submit request: '+err.message}finally{btn.disabled=false}});
init();
</script></body></html>
