<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Approvals | EduManage</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:1000px;margin:24px auto}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 8px 24px #14213d0b}h1{margin:0 0 8px;color:#14213d}p{color:#64748b;line-height:1.5}.msg{padding:12px;border-radius:8px;margin:12px 0;background:#eff6ff;color:#1d4ed8}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0;vertical-align:top}th{background:#f8fafc}button{border:0;border-radius:8px;padding:9px 12px;background:#15803d;color:white;font-weight:700;cursor:pointer;margin:2px}button.reject{background:#b91c1c}button:disabled{opacity:.6}.muted{font-size:12px;color:#64748b}a{color:#2563eb}
</style></head><body><main class="wrap"><section class="card"><h1>School registration approvals</h1><p>Super Admin only. Approving creates the school and links its requesting administrator to it. Rejected requests do not grant school access.</p><div id="notice" class="msg">Checking your account…</div><div id="list" class="tablewrap"></div><p><a href="./index.html">Return to EduManage</a></p></section></main>
<script>
const URL='https://emdmnimxeoifgobzuglx.supabase.co', KEY='sb_publishable_ewvNnOPh_pGROM_f_rp1Sg_bWGi5OAV', sb=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null;
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){$('notice').textContent='Please sign in to the main EduManage app first.';return}user=session.user;const {data:p,error}=await sb.from('profiles').select('role').eq('id',user.id).single();if(error||p?.role!=='super_admin'){$('notice').textContent='Access denied. This page is only for the Super Admin.';return}$('notice').textContent='Authenticated as Super Admin. Pending requests are listed below.';await load()}
async function load(){const {data,error}=await sb.from('school_registration_requests').select('id,school_name,code,county,requested_by,status,created_at,review_notes').order('created_at',{ascending:false}).limit(200);if(error){$('list').innerHTML='<p>'+esc(error.message)+'</p>';return}if(!data?.length){$('list').innerHTML='<p>No school registration requests yet.</p>';return}const pending=data.filter(r=>r.status==='pending');$('list').innerHTML='<table><thead><tr><th>School request</th><th>Administrator</th><th>Status</th><th>Submitted</th><th>Decision</th></tr></thead><tbody>'+data.map(r=>'<tr><td><b>'+esc(r.school_name)+'</b><div class="muted">Code: '+esc(r.code)+'<br>County: '+esc(r.county||'—')+'</div>'+(r.review_notes?'<div class="muted">'+esc(r.review_notes)+'</div>':'')+'</td><td>'+esc(r.requested_by)+'</td><td>'+esc(r.status)+'</td><td>'+esc(new Date(r.created_at).toLocaleString())+'</td><td>'+(r.status==='pending'?'<button data-approve="'+r.id+'">Approve</button><button class="reject" data-reject="'+r.id+'">Reject</button>':'—')+'</td></tr>').join('')+'</tbody></table>';$('list').querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>decide(b.dataset.approve,'approved'));$('list').querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>decide(b.dataset.reject,'rejected'))}
async function decide(id,status){const btn=$('list').querySelector('[data-approve="'+id+'"],[data-reject="'+id+'"]');if(btn)btn.disabled=true;try{const {data:r,error}=await sb.from('school_registration_requests').select('*').eq('id',id).single();if(error)throw error;if(r.status!=='pending')throw new Error('This request has already been reviewed.');if(status==='rejected'){const notes=prompt('Reason for rejection (optional):')||null;const {error:e}=await sb.from('school_registration_requests').update({status:'rejected',reviewed_by:user.id,reviewed_at:new Date().toISOString(),review_notes:notes}).eq('id',id);if(e)throw e}else{const {data:existing,error:checkErr}=await sb.from('schools').select('id').eq('code',r.code).maybeSingle();if(checkErr)throw checkErr;if(existing)throw new Error('That school code is already in use. Review the existing school before approving.');const {data:school,error:createErr}=await sb.from('schools').insert({name:r.school_name,code:r.code,county:r.county,status:'approved',approved_at:new Date().toISOString(),approved_by:user.id}).select('id').single();if(createErr)throw createErr;const {error:profileErr}=await sb.from('profiles').update({school_id:school.id}).eq('id',r.requested_by);if(profileErr)throw new Error('School was created but administrator linking failed: '+profileErr.message);const {error:updateErr}=await sb.from('school_registration_requests').update({status:'approved',reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq('id',id);if(updateErr)throw new Error('School was created and administrator linked, but request status update failed: '+updateErr.message)}$('notice').textContent='Request '+status+'.';await load()}catch(e){$('notice').textContent='Could not complete decision: '+e.message;if(btn)btn.disabled=false}}
init();
</script></body></html>
